name: Continuous Deployment

on:
  push:
    branches: [main]

jobs:
  Deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build app
      - name: Build app
        run: npm run build

      # 5. Set up gcloud
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_CREDENTIALS }}
          project_id: project-82256888-675b-4d03-af9 

      # 6. Build and push Docker image
      - name: Build and push Docker image
        run: |
          gcloud builds submit \
            --tag REGION-docker.pkg.dev/project-82256888-675b-4d03-af9/notely-ar-repox/notely:latest .