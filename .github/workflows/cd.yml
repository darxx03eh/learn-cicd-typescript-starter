name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      # 5. التوثيق عبر WIF (الرقم الصحيح: 830778851432)
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/830778851432/locations/global/workloadIdentityPools/notely-pool-new/providers/notely-provider'
          service_account: 'cloud-run-deployer-903@project-82256888-675b-4d03-af9.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 7. البناء والدفع: الحل النهائي لمشكلة الـ Org Policy والـ Logging
      - name: Build and Push to Artifact Registry
        run: |
          IMAGE_TAG=us-central1-docker.pkg.dev/project-82256888-675b-4d03-af9/notely-ar-repo/notely:${GITHUB_SHA::8}
          
          # استعملنا الصيغة المختصرة للـ logging اللي بتطلبها جوجل مع تحديد الحساب
          # ووضعنا النقطة في مكانها الصحيح لتفادي مشاكل الـ arguments
          gcloud builds submit . \
            --tag=$IMAGE_TAG \
            --service-account="projects/project-82256888-675b-4d03-af9/serviceAccounts/cloud-run-deployer-903@project-82256888-675b-4d03-af9.iam.gserviceaccount.com" \
            --logging=cloud-logging

      - name: Run database migrations
        run: npm run db:migrate

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy notely \
            --image us-central1-docker.pkg.dev/project-82256888-675b-4d03-af9/notely-ar-repo/notely:${GITHUB_SHA::8} \
            --region us-central1 \
            --allow-unauthenticated \
            --project project-82256888-675b-4d03-af9 \
            --max-instances=4