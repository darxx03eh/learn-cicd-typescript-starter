name: cd

on: 
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      BUILD_SERVICE_ACCOUNT: cloud-run-deployer-71@project-82256888-675b-4d03-af9.iam.gserviceaccount.com

    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and Push to Artifact Registry
        run: |
          gcloud builds submit --service-account projects/project-82256888-675b-4d03-af9/serviceAccounts/$BUILD_SERVICE_ACCOUNT --gcs-log-dir=gs://project-82256888-675b-4d03-af9_cloudbuild/logs --tag us-central1-docker.pkg.dev/project-82256888-675b-4d03-af9/notely-ar-repom/notely:latest .

      - name: Verify image exists
        run: |
          gcloud artifacts docker images describe us-central1-docker.pkg.dev/project-82256888-675b-4d03-af9/notely-ar-repom/notely:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy notely \
            --image us-central1-docker.pkg.dev/project-82256888-675b-4d03-af9/notely-ar-repom/notely:latest \
            --service-account $BUILD_SERVICE_ACCOUNT \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --project project-82256888-675b-4d03-af9 \
            --max-instances=4 \
            --clear-env-vars \
            --clear-secrets \
            --port=8080 \
            --memory=512Mi \
            --timeout=300 \
            --min-instances=0 || {
              echo "Deployment failed, fetching logs..."
              LATEST_REVISION=$(gcloud run revisions list --service notely --region us-central1 --project project-82256888-675b-4d03-af9 --format='value(metadata.name)' --limit=1)
              echo "Latest revision: $LATEST_REVISION"
              gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=notely AND resource.labels.revision_name=$LATEST_REVISION AND (logName=projects/project-82256888-675b-4d03-af9/logs/run.googleapis.com%2Fstdout OR logName=projects/project-82256888-675b-4d03-af9/logs/run.googleapis.com%2Fstderr)" --limit 100 --format='value(textPayload)' --project project-82256888-675b-4d03-af9
              gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=notely AND resource.labels.revision_name=$LATEST_REVISION" --limit 30 --format json --project project-82256888-675b-4d03-af9
              exit 1
            }