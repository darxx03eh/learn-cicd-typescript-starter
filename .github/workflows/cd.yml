name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # 1. Checkout code
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build the app
      - name: Build the app
        run: npm run build

      # 5. Clean any old GCP credentials
      - name: Clean GCP Credentials
        run: rm -f $GOOGLE_APPLICATION_CREDENTIALS

      # 6. Authenticate to GCP via Workload Identity Federation
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/830778851432/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'cloud-run-deployer@project-82256888-675b-4d03-af9.iam.gserviceaccount.com'
          audience: 'repo:darxx03eh/learn-cicd-typescript-starter'
          create_credentials_file: true
          export_environment_variables: true

      # 7. Explicitly activate the service account in Cloud SDK
      - name: Activate GCP credentials in gcloud
        run: |
          echo "Activating credentials for Cloud SDK"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          gcloud config set project project-82256888-675b-4d03-af9

      # 8. Build and Push Docker image to Artifact Registry
      - name: Build and Push to Artifact Registry
        run: |
          IMAGE_TAG=us-central1-docker.pkg.dev/project-82256888-675b-4d03-af9/notely-ar-repo/notely:${GITHUB_SHA::8}
          echo "Building Docker image with tag $IMAGE_TAG"
          gcloud builds submit --tag $IMAGE_TAG .

      # 9. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy notely \
            --image us-central1-docker.pkg.dev/project-82256888-675b-4d03-af9/notely-ar-repo/notely:${GITHUB_SHA::8} \
            --region us-central1 \
            --allow-unauthenticated \
            --project project-82256888-675b-4d03-af9 \
            --max-instances=4