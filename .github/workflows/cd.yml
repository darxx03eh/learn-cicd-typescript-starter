name: cd

on: 
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BUILD_SERVICE_ACCOUNT: cloud-run-deployer-71@project-82256888-675b-4d03-af9.iam.gserviceaccount.com

    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and Push to Artifact Registry
        run: |
          gcloud builds submit \
            --service-account $BUILD_SERVICE_ACCOUNT \
            --gcs-log-dir=gs://project-82256888-675b-4d03-af9_cloudbuild/logs \
            --tag us-central1-docker.pkg.dev/project-82256888-675b-4d03-af9/notely-ar-repom/notely:latest .

      - name: List Docker images (verify build)
        run: gcloud artifacts docker images list us-central1-docker.pkg.dev/project-82256888-675b-4d03-af9/notely-ar-repom

      - name: Run database migrations
        run: npm run db:migrate

      - name: Delete existing Cloud Run service (if exists)
        run: |
          if gcloud run services describe notely --region us-central1; then
            gcloud run services delete notely --region us-central1 --quiet
          fi

      - name: Deploy to Cloud Run (fresh service)
        run: |
          gcloud run deploy notely \
            --image us-central1-docker.pkg.dev/project-82256888-675b-4d03-af9/notely-ar-repom/notely:latest \
            --region us-central1 \
            --allow-unauthenticated \
            --service-account $BUILD_SERVICE_ACCOUNT \
            --max-instances=4 \
            --concurrency=80 \
            --timeout=300

      - name: Set revision retention limit
        run: |
          gcloud run services update notely \
            --region us-central1 \
            --revision-retention-limit 5