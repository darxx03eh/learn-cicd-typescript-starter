name: cd

on: 
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BUILD_SERVICE_ACCOUNT_EMAIL: cloud-run-deployer-71@project-82256888-675b-4d03-af9.iam.gserviceaccount.com
      PROJECT_ID: project-82256888-675b-4d03-af9

    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and Push to Artifact Registry
        run: |
          gcloud builds submit \
            --service-account projects/$PROJECT_ID/serviceAccounts/$BUILD_SERVICE_ACCOUNT_EMAIL \
            --logging=CLOUD_LOGGING_ONLY \
            --tag us-central1-docker.pkg.dev/$PROJECT_ID/notely-ar-repom/notely:latest .

      - name: List Docker images (verify build)
        run: gcloud artifacts docker images list us-central1-docker.pkg.dev/$PROJECT_ID/notely-ar-repom

      - name: Run database migrations (headless Turso)
        run: |
          turso auth login --headless $TURSO_AUTH_TOKEN
          npm run db:migrate

      - name: Delete existing Cloud Run service (if exists)
        run: |
          if gcloud run services describe notely --region us-central1; then
            gcloud run services delete notely --region us-central1 --quiet
          fi

      - name: Deploy to Cloud Run (fresh service)
        run: |
          gcloud run deploy notely \
            --image us-central1-docker.pkg.dev/$PROJECT_ID/notely-ar-repom/notely:latest \
            --region us-central1 \
            --allow-unauthenticated \
            --service-account $BUILD_SERVICE_ACCOUNT_EMAIL \
            --max-instances=4 \
            --concurrency=80 \
            --timeout=300

      - name: Set revision retention limit
        run: |
          gcloud run services update notely \
            --region us-central1 \
            --revision-retention-limit 5

      - name: Allow public access (Cloud Run Invoker)
        run: |
          gcloud run services add-iam-policy-binding notely \
            --region us-central1 \
            --member=allUsers \
            --role=roles/run.invoker