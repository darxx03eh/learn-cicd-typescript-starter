name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: project-82256888-675b-4d03-af9
  REGION: us-central1
  SERVICE_NAME: notely
  REPO_NAME: notely-ar-repox

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/82256888/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: cloud-run-deployer-903@project-82256888-675b-4d03-af9.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Push Image (Cloud Build)
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${GITHUB_SHA::8}
          echo "Building Docker image with tag $IMAGE_TAG"

          gcloud builds submit \
            --tag $IMAGE_TAG \
            --project $PROJECT_ID \
            --service-account=projects/$PROJECT_ID/serviceAccounts/cloud-run-deployer-903@$PROJECT_ID.iam.gserviceaccount.com \
            --logging=CLOUD_LOGGING_ONLY

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE_TAG \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --project $PROJECT_ID